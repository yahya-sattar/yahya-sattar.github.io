title: "Learning and Control Beyond Linearity"
subtitle: "Towards a Non-asymptotic Theory for Bilinear Systems"
eyebrow: "IEEE Conference on Decision and Control · CDC 2026 · Tutorial Session"
conference_url: https://cdc2026.ieeecss.org/
date: "December 15–18, 2026 (session day and time to be announced)"
location: "Hilton Hawaiian Village, Honolulu, Hawaii"
length: "1 hour 45 minutes"
paper_url: https://arxiv.org/pdf/2609.22338
contact: ysattar@cornell.edu

abstract: >-
  This tutorial provides a unified view of the emerging area of bilinear learning and control.
  Using linear systems as a benchmark, it explains what fundamentally changes in the bilinear
  settings, how recent theory addresses finite-sample learning and control, and how these ideas
  connect to broader themes in nonlinear control, representation learning, and data-driven decision
  making. For learning, we emphasize tools that are particularly useful in the bilinear settings, such
  as one-sided Bernstein's inequality for dependent and heavy-tailed covariates, blocking arguments,
  and martingale concentration for input-dependent noise. We then apply these tools to obtain
  finite-sample learning guarantees for fully observed bilinear systems, partially observed bilinear
  systems, and linear systems with bilinear observations. For control, we discuss quadratic control
  from bilinear observations, where the classical separation principle fails, and review tractable
  approaches based on belief-space receding horizon control. We also cover stabilization of bilinear
  dynamics under state feedback using semi-definite programming, LMI relaxations, sum-of-squares
  methods, and Koopman-based lifting. We conclude by discussing the open problems in combined
  learning and control of bilinear systems.

topics:
  - "Least-squares theory for dependent and heavy-tailed covariates: one-sided Bernstein inequality, blocking arguments, martingale concentration"
  - "Finite-sample identification of fully observed bilinear systems"
  - "Finite-sample identification of partially observed bilinear systems and linear systems with bilinear observations"
  - "Quadratic control from bilinear observations and the failure of the separation principle"
  - "Dual control with belief-space receding horizon (model predictive) control"
  - "Stabilization of bilinear dynamics: SDP, LMI relaxations, sum-of-squares, and Koopman-based lifting"
  - "Open problems in combined learning and control of bilinear systems"

